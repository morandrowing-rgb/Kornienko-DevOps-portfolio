# GitLab CI для учебного приложения Multi-CI/CD (проект 04).
#
# Честно о границах: production-деплоя здесь нет.
#   test  — компиляция и импорт Flask-приложения;
#   build — сборка Docker-образа (docker:dind), образ сохраняется как artifact;
#   deploy (manual) — smoke-проверка: тот же образ запускается внутри раннера,
#           проверяется HTTP-ответ, контейнер останавливается. Это не деплой
#           на сервер, а ручная проверка, что образ правда работает.
# Устаревший `only:` заменён на `rules:`.

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  LOCAL_IMAGE: "multi-ci-cd-app:$CI_COMMIT_SHORT_SHA"

cache:
  key:
    files:
      - app/requirements.txt
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11-slim
  script:
    - cd app
    - python -m py_compile app.py
    - pip install --no-cache-dir -r requirements.txt
    # Импорт модуля не должен запускать сервер (app.run под __main__).
    - python -c "import app; print(app.app.url_map)"
  rules:
    - changes:
        - app/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # Dockerfile лежит в app/, контекст сборки — тоже app/.
    - docker build -t "$LOCAL_IMAGE" -f app/Dockerfile app
    - docker image inspect "$LOCAL_IMAGE" > /dev/null
    - docker save "$LOCAL_IMAGE" -o multi-ci-cd-app.tar
  artifacts:
    expire_in: 3 days
    paths:
      - multi-ci-cd-app.tar
  rules:
    - changes:
        - app/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Ручная smoke-проверка образа внутри CI-раннера (не production-деплой).
smoke-manual:
  stage: deploy
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - apk add --no-cache curl
    - docker build -t "$LOCAL_IMAGE" -f app/Dockerfile app
    - docker run -d --name smoke -p 5000:5000 "$LOCAL_IMAGE"
    - |
      for i in $(seq 1 15); do
        if curl -fsS http://localhost:5000/ > /tmp/response.html; then break; fi
        sleep 1
      done
    - cat /tmp/response.html
    - grep -qi "Multi-CI/CD" /tmp/response.html
    - docker logs smoke
    - docker rm -f smoke
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
