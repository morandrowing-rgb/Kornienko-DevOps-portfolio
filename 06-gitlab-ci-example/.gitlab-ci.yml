# Учебный GitLab CI для проекта 06: lint -> test -> build.
#
# Это самостоятельный пример пайплайна, а не production-деплой:
# образ собирается и сохраняется как artifact, никуда не публикуется
# и ни на какой сервер не выкатывается.

stages:
  - lint
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_NAME: "gitlab-ci-example:$CI_COMMIT_SHORT_SHA"

# Кэш pip ускоряет повторные запуски; ключ зависит от requirements.txt.
default:
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install flake8
    - python -m py_compile app.py test_app.py
    - flake8 app.py test_app.py --max-line-length=100
  rules:
    - changes:
        - app.py
        - test_app.py
        - requirements.txt
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -v 2>&1 | tee test-output.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-output.txt
  rules:
    - changes:
        - app.py
        - test_app.py
        - requirements.txt
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # У build-джобы свой раннер-образ (docker), pip-кэш ей не нужен.
  cache: {}
  script:
    - docker build -t "$IMAGE_NAME" .
    - docker image inspect "$IMAGE_NAME" > /dev/null
    - docker save "$IMAGE_NAME" -o gitlab-ci-example.tar
    - ls -lh gitlab-ci-example.tar
  artifacts:
    expire_in: 3 days
    paths:
      - gitlab-ci-example.tar
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
