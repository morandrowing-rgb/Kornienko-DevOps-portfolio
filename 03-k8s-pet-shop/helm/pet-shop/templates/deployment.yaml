apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports: [{ containerPort: {{ .Values.frontend.containerPort }} }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports: [{ containerPort: {{ .Values.backend.containerPort }} }]
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
