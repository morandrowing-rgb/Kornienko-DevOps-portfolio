apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: frontend }
  ports: [{ port: {{ .Values.frontend.servicePort }}, targetPort: {{ .Values.frontend.containerPort }} }]
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: {{ .Values.backend.containerPort }} }]
  type: ClusterIP
